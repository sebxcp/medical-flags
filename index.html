<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>medical-flags</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #202124;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 680px;
        margin: 0 0 24px;
        color: #4b5563;
      }

      a {
        color: #12637a;
      }

      pre {
        overflow: auto;
        padding: 16px;
        border: 1px solid #d7d7ce;
        border-radius: 8px;
        background: #ffffff;
        min-height: 160px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #171916;
          color: #f4f5ef;
        }

        p {
          color: #c9ccc2;
        }

        a {
          color: #85d3e6;
        }

        pre {
          border-color: #3d4038;
          background: #20231d;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>medical-flags</h1>
      <p>
        JSON flag event log. The direct endpoint is
        <a href="./events.json">events.json</a>.
      </p>
      <pre id="events">Loading events.json...</pre>
    </main>
    <script>
      async function loadEvents() {
        const output = document.querySelector("#events");

        try {
          const response = await fetch("./events.json", { cache: "no-store" });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const events = await response.json();
          output.textContent = JSON.stringify(events, null, 2);
        } catch (error) {
          output.textContent = `Unable to load events.json: ${error.message}`;
        }
      }

      loadEvents();
    </script>
  </body>
</html>
